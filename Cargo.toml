[package]
name = "redmibook-fan-mode"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["0x57C0DE"]
description = "Fn+K fan mode notification for the Redmi Book Pro 15 2022 on Linux"
license = "MIT"
repository = "https://github.com/0x57C0DE/RedmiBook-Fan-Mode"
readme = "README.md"
keywords = ["redmibook", "xiaomi", "fan", "embedded-controller", "linux"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde_json = "1"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
