name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PKG: redmibook-fan-mode-x86_64-linux
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Tag matches Cargo.toml
        run: grep -qx "version = \"${GITHUB_REF_NAME#v}\"" Cargo.toml
      - run: make check
      - run: make build
      - name: Package
        run: |
          mkdir -p "$PKG/systemd" "$PKG/modprobe.d"
          cp target/release/redmibook-fan-mode Makefile README.md LICENSE CHANGELOG.md "$PKG/"
          cp systemd/* "$PKG/systemd/"
          cp modprobe.d/* "$PKG/modprobe.d/"
          tar czf "$PKG.tar.gz" "$PKG"
          sha256sum "$PKG.tar.gz" > "$PKG.tar.gz.sha256"
      - name: Release notes
        run: awk -v v="## $GITHUB_REF_NAME" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md "$PKG.tar.gz" "$PKG.tar.gz.sha256"
